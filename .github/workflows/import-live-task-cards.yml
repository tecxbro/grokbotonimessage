name: Import supplied Live Task Cards package
on:
  push:
    branches: [live-task-cards]
    paths: ['.github/workflows/import-live-task-cards.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore the verified original package as separate files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, io, json, os, pathlib, stat, urllib.request, zipfile
          repo = os.environ['REPOSITORY']
          assert repo == 'tecxbro/grokbotonimessage'
          branch = 'live-task-cards'
          parent = os.environ['EXPECTED_COMMIT']
          url = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-85d4-81fd-9564-3668345e63a9/raw?se=2026-09-24T02%3A49%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=ece6f4fe-975a-59fe-a619-457547f18500&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T01%3A32%3A56Z&ske=2026-09-25T01%3A32%3A56Z&sks=b&skv=2026-02-06&sig=h7AzFrgTlnfmPCPhOzp97dvmQqBpNZhPdxv02SawUc8%3D'
          with urllib.request.urlopen(url, timeout=90) as response:
              archive = response.read(12_000_001)
          assert hashlib.sha256(archive).hexdigest() == '810ae24372b01481de95731a1d302dd09949848be8b6fd64cc3cf7a2b99481a5', 'Archive checksum mismatch'
          z = zipfile.ZipFile(io.BytesIO(archive))
          entries = z.infolist()
          assert len(entries) == 61 and len({e.filename for e in entries}) == 61
          files = {}
          for entry in entries:
              path = pathlib.PurePosixPath(entry.filename)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] == 'live-task-cards'
              assert not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16)
              files[entry.filename] = z.read(entry)
          manifest = json.loads(files['live-task-cards/MANIFEST.sha256.json'])
          assert set(files) == {'live-task-cards/' + p for p in manifest} | {'live-task-cards/MANIFEST.sha256.json'}
          for path, digest in manifest.items():
              assert hashlib.sha256(files['live-task-cards/' + path]).hexdigest() == digest, path
          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, data=data, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'live-task-cards-package-import'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          assert api('GET', 'git/ref/heads/' + branch)['object']['sha'] == parent, 'Branch moved before import'
          def upload(entry):
              data = files[entry.filename]
              blob = api('POST', 'git/blobs', {'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'})
              expected_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob['sha'] == expected_blob, entry.filename
              mode = '100755' if (entry.external_attr >> 16) & 0o111 else '100644'
              return {'path': entry.filename, 'mode': mode, 'type': 'blob', 'sha': blob['sha']}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              tree_entries = list(pool.map(upload, entries))
          tree = api('POST', 'git/trees', {'tree': tree_entries})
          commit = api('POST', 'git/commits', {'message': 'Import original Live Task Cards V1 package (61 files; package-only branch)', 'tree': tree['sha'], 'parents': [parent]})
          assert api('GET', 'git/ref/heads/' + branch)['object']['sha'] == parent, 'Branch moved during import'
          api('PATCH', 'git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False})
          actual = api('GET', 'git/trees/' + tree['sha'] + '?recursive=1')
          actual_blobs = {e['path']: e['sha'] for e in actual['tree'] if e['type'] == 'blob'}
          assert not actual.get('truncated') and actual_blobs == {e['path']: e['sha'] for e in tree_entries}
          print('Uploaded and verified all 61 original files, including five PNG assets/references.')
          print('Commit:', commit['sha'])
          print('Root contains only live-task-cards/. No source files changed; no application code executed.')
          PY
