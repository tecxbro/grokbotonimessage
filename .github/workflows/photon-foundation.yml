name: Photon foundation
on:
  push:
    paths: ['packages/photon-features/**', 'scripts/**', 'docs/worktrees/**', 'docs/photon-features/**', 'package.json', 'package-lock.json', '.github/workflows/photon-*.yml']
  pull_request:
    paths: ['packages/photon-features/**', 'scripts/**', 'docs/worktrees/**', 'docs/photon-features/**', 'package.json', 'package-lock.json', '.github/workflows/photon-*.yml']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run photon:test
      # Foundation tests above run against the current assembled checkout.
      # Frozen F0 contract validation is the separate photon:check:foundation command.
      - name: Generated assembled-candidate contract drift
        run: npm run photon:check
