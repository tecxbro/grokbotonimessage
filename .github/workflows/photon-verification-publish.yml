name: Publish verified maintenance objects
on:
  push:
    branches: [improving-friends-bot]
    paths: ['.github/workflows/photon-verification-publish.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'tecxbro/grokbotonimessage' && github.ref == 'refs/heads/improving-friends-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact patch, publish immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,subprocess,pathlib,json,os
          base='9d97260628b81f404e8f71a553fcc152a624a596'
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==['.github/workflows/photon-verification-publish.yml']
          encoded=''
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='06cd14763c308c2c62dec4d96889ee22d07592500f93555814c0d56d30210b80'
          decoder=lzma.LZMADecompressor();patch=decoder.decompress(raw,max_length=262144)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest()=='3bbc8bea2369748b1ec6a2caad2e9b1883220af8242b1761047275b9a22c59ed'
          file=pathlib.Path(os.environ['RUNNER_TEMP'],'verified.patch');file.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(file)],check=True)
          subprocess.run(['git','apply','--index',str(file)],check=True)
          subprocess.run(['git','rm','.github/workflows/photon-verification-publish.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='92ede4355eb84d612bc5c1838ff1662284d9b4e7'
          paths=['AGENTS.md','docs/worktrees/ownership.json','docs/worktrees/friend-scratch/FILES.json','packages/photon-features/tests/artifact/scratch-distribution.mjs','packages/photon-features/scratch-setup/REVIEW.md']
          output=[]
          for path in paths:
            data=pathlib.Path(path).read_bytes()
            expected=subprocess.check_output(['git','hash-object',path],text=True).strip()
            result=subprocess.run(['gh','api','--method','POST','repos/tecxbro/grokbotonimessage/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}),text=True,capture_output=True,check=True)
            sha=json.loads(result.stdout)['sha'];assert sha==expected
            output.append({'path':path,'sha':sha,'mode':'100644','type':'blob'})
          print(json.dumps({'tree':'92ede4355eb84d612bc5c1838ff1662284d9b4e7','entries':output,'branchUpdated':False}))
          PY
